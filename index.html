<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ravenmoor Times Tables</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=VT323&family=Nunito:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: a storybook quest, warm and magical, never babyish; for an 11 year old.
   IDEA: a wizard school's enchanted quest map and spellbook, lit by candlelight.
   PICTURE: a moonlit castle skyline over the quest path; the duel arena with a candle timer.
   COLOUR and TYPE: deep aubergine night, parchment cards, candle gold, house colours as accents. Cinzel titles, Nunito body and big numbers.
   LAYOUT: one centered column up to 720px; castle header, then the working screen (map, duel, spellbook). */
:root{color-scheme:dark;--bg:#1c1230;--bg2:#2a1c46;--ink:#f6eedc;--mut:#c9bce0;--parch:#f3e6c4;--pink:#2a1a10;--gold:#f2c14e;--red:#d2424b;--ok:#5cc489;--line:#4a3a6b;--house:#f2c14e}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#3b2a63,transparent 70%),var(--bg);color:var(--ink);font:17px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
h1,h2,h3{font-family:Cinzel,Georgia,serif;line-height:1.1;text-wrap:balance;margin:0 0 .4em}
h1{font-size:clamp(28px,6vw,44px)}h2{font-size:clamp(22px,4.5vw,30px)}h3{font-size:19px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
.sky{position:relative;height:clamp(150px,30vw,210px);margin:0 -16px 8px}
.sky svg{position:absolute;inset:0;width:100%;height:100%}
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:-56px 0 18px;position:relative}
.who{display:flex;gap:10px;align-items:center}
.pts{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:900;white-space:nowrap}
.card{background:var(--parch);color:var(--pink);border-radius:14px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 0 2px #e0cfa3}
.card p{margin:.3em 0 .9em}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;min-height:44px;padding:10px 18px;font-weight:900;color:var(--pink);background:var(--gold);box-shadow:0 3px 0 #a87f1d}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #a87f1d}
button.danger{background:#b5303a;color:#fff;box-shadow:0 3px 0 #7a1f2a}
button.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.card button.ghost{color:var(--pink);box-shadow:inset 0 0 0 2px #c9b27a}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=text]{font:inherit;font-size:17px;padding:12px;border-radius:10px;border:2px solid #c9b27a;background:#fffaf0;color:var(--pink);width:100%}
.houses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0 16px}
.house{display:flex;gap:10px;align-items:center;text-align:left;background:#fffaf0;color:var(--pink);box-shadow:inset 0 0 0 2px #e0cfa3;font-weight:700}
.house.on{box-shadow:inset 0 0 0 3px var(--pink)}
.house small{display:block;font-weight:500;font-size:13px}
.year{margin:22px 0 8px;color:var(--gold);font-family:Cinzel,serif;font-size:15px}
.path{display:grid;gap:10px}
.node{width:100%;margin-bottom:10px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:var(--bg2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);padding:12px 14px}
.node .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#3a2b5c;font-family:Cinzel,serif;font-size:15px}
.node.done .dot{background:var(--ok);color:#10301f}
.node.cur{box-shadow:inset 0 0 0 3px var(--gold),0 0 24px rgba(242,193,78,.35)}
.node.cur .dot{background:var(--gold);color:var(--pink)}
.node.lock{opacity:.45;cursor:not-allowed}
.node.boss .dot{border-radius:10px;transform:rotate(45deg)}.node.boss .dot span{transform:rotate(-45deg)}
.node small{display:block;color:var(--mut);font-weight:500;font-size:14px}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:width .4s}
.card .bar{background:#e3d3a8}
.q{font:900 clamp(48px,14vw,84px)/1 Nunito,sans-serif;text-align:center;margin:8px 0 4px;letter-spacing:.02em;white-space:nowrap}
.ans{font:900 clamp(40px,11vw,64px)/1.1 Nunito,sans-serif;text-align:center;min-height:1.2em;border-bottom:3px dashed #c9b27a;margin:0 auto 14px;max-width:220px}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:340px;margin:0 auto}
.pad button{font-size:24px;min-height:56px;background:#fffaf0;box-shadow:0 3px 0 #c9b27a}
.pad .cast{background:var(--gold);box-shadow:0 3px 0 #a87f1d}
.fb{text-align:center;min-height:28px;font-weight:900;margin:4px 0 10px}
.fb.good{color:#1f7a4a}.fb.bad{color:#a3242c}
.hint{background:#fff3d1;border-radius:10px;padding:10px 14px;margin:10px 0;font-weight:700}
.arena{display:grid;grid-template-columns:84px minmax(0,1fr) 110px;gap:14px;align-items:center;margin-bottom:12px}
.arena>svg:last-child{width:110px;height:110px}
.hearts{font-weight:900;color:var(--red);letter-spacing:4px}
.candle{height:10px;border-radius:9px;background:#e3d3a8;overflow:hidden;margin:6px 0 2px}
.candle i{display:block;height:100%;background:linear-gradient(90deg,#f2c14e,#ff8a3d)}
.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px;font-size:13px;font-weight:900}
.grid div,.grid button{aspect-ratio:1;display:grid;place-items:center;border-radius:6px;padding:0;min-height:0;box-shadow:none;font-size:clamp(10px,2.6vw,14px)}
.grid .h{color:var(--gold);background:transparent}
.l0{background:#3a2b5c;color:#9d8fbf}.l1{background:#7a2e3a;color:#ffd9dd}.l2{background:#c99a2e;color:#2a1a10}.l3{background:#e8c65a;color:#2a1a10}.l4{background:#b6e08a;color:#10301f}.l5{background:#7fe0a8;color:#10301f}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:12px 0;font-size:14px;color:var(--mut)}
.legend span{display:inline-flex;gap:6px;align-items:center}.legend b{width:16px;height:16px;border-radius:4px;display:inline-block}
.muted{color:var(--mut);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}
.list{margin:6px 0 0;padding:0;list-style:none}.list li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.card{position:relative}
.scene{display:block;width:100%;height:auto;border-radius:12px;margin:0 0 14px;box-shadow:0 0 0 2px #e0cfa3}
.burst{position:absolute;left:50%;top:44%;width:220px;height:220px;margin:-110px 0 0 -110px;pointer-events:none;overflow:visible}
.burst g{transform:rotate(var(--a));animation:fly .75s ease-out forwards}
@keyframes fly{0%{transform:rotate(var(--a)) translateY(-4px) scale(.4);opacity:1}100%{transform:rotate(var(--a)) translateY(-56px) scale(1.3);opacity:0}}
.cf{animation:fall 2.4s linear infinite}@keyframes fall{to{transform:translateY(190px) rotate(240deg)}}
.hit{animation:shake .45s}@keyframes shake{25%{transform:translateX(-7px) rotate(-4deg)}75%{transform:translateX(7px) rotate(4deg)}}
.hop{animation:hop .55s}@keyframes hop{40%{transform:translateY(-12px) scale(1.05)}}
.player{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;align-items:center;margin:10px 0 0}
.bubble{background:#fffaf0;border-radius:14px;padding:10px 14px;font-weight:900;position:relative;box-shadow:inset 0 0 0 2px #e0cfa3}
.bubble:before{content:"";position:absolute;left:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:#e0cfa3;border-left:0}
.bubble.good{color:#1f7a4a}.bubble.bad{color:#a3242c}
.build{display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;align-items:start}
.pv{background:radial-gradient(circle at 50% 40%,#3b2a63,#1c1230);border-radius:14px;padding:10px;display:grid;justify-items:center;gap:8px}
.opts b{display:block;margin-top:6px}
.sws{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.sw{width:44px;height:44px;padding:0;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.sw.on{outline:3px solid var(--pink);outline-offset:2px}
.chip{background:#fffaf0;box-shadow:inset 0 0 0 2px #e0cfa3;font-weight:700;padding:8px 14px;text-transform:capitalize}
.chip.on{box-shadow:inset 0 0 0 3px var(--pink)}
.mapav{margin:-10px -4px -10px 0}
.wz{display:inline-flex;align-items:flex-end}.pet{margin-left:-14px}
.hud .pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.hud .ghost{min-height:36px;padding:4px 12px;font-size:14px}
.shopg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--parch);color:var(--pink);border-radius:12px;padding:10px;text-align:center;display:grid;gap:6px;justify-items:center}
.item .pv2{height:84px;display:grid;place-items:center}.item button{width:100%}.item button.ghost{color:var(--pink);box-shadow:inset 0 0 0 2px #c9b27a}
button:disabled{opacity:.45;cursor:not-allowed}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.wc{display:grid;justify-items:center;gap:2px;border-radius:10px;padding:8px 6px;background:linear-gradient(#3b2a63,#1c1230);color:#f6eedc;text-align:center;box-shadow:inset 0 0 0 3px #c9bce0;font-size:13px;font-weight:700;line-height:1.2}
.wc small{font-weight:500;color:var(--mut);font-size:12px}.wc.t1{box-shadow:inset 0 0 0 3px #f2c14e}.wc.t2{box-shadow:inset 0 0 0 3px #f2c14e,0 0 16px rgba(242,193,78,.6);background:linear-gradient(#5a1f6a,#1c1230)}
.wc.miss{opacity:.55}.wc.big{min-width:130px;flex:none}
.reveal{text-align:center;display:grid;justify-items:center;gap:8px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0 14px}.stats div{background:#fffaf0;border-radius:10px;padding:10px;font-size:14px}.stats b{display:block;font-size:26px;line-height:1.1}
.days{display:flex;gap:6px;align-items:flex-end;height:130px}.days div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:13px}.days i{width:100%;background:var(--gold);border-radius:6px 6px 0 0;min-height:2px;display:block}
.trow{display:grid;grid-template-columns:40px minmax(0,1fr) 48px;gap:10px;align-items:center;padding:3px 0;font-size:15px}.trow span:last-child{text-align:right;white-space:nowrap}
.bar2{position:relative;height:12px;border-radius:9px;background:#e3d3a8;overflow:hidden}.bar2 i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:9px}.bar2 i.s{background:#3c9a5a}
.list.plain li{border-color:#e0cfa3}
.grid .due{outline:2px dashed #fff;outline-offset:-3px}
#toast{position:fixed;left:50%;top:12px;transform:translate(-50%,-160%);transition:transform .35s;z-index:9;background:var(--parch);color:var(--pink);border-radius:14px;padding:10px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:92vw;font-size:15px}
#toast.show{transform:translate(-50%,0)}
.qt{text-align:center;margin:12px 0 0;font-weight:900;color:#7a6440;font-size:14px}
.q.sm{font-size:clamp(36px,10vw,60px)}
.opts4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:360px;margin:14px auto 0}.opts4 button{font-size:28px;min-height:64px;background:#fffaf0;box-shadow:0 3px 0 #c9b27a}
.race{display:grid;gap:6px;margin-bottom:6px}.lane{position:relative;height:44px;border-radius:22px;background:linear-gradient(90deg,#e3d3a8,#d8c48e);display:flex;align-items:center;margin-inline:18px 6px}.lane.gh .rider{opacity:.4}.rider{position:absolute;top:-6px;transition:left .3s}.flag{position:absolute;right:6px;top:6px;width:6px;height:32px;background:repeating-linear-gradient(#2a1a10 0 6px,#fff 6px 12px)}
.score{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}.score div{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:12px}.score div.on{background:#fff3d1;box-shadow:inset 0 0 0 2px var(--gold)}.score b{font-size:24px}.score .vs{font-weight:900;color:#7a6440}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.bd{background:var(--bg2);border-radius:12px;padding:10px;text-align:center;display:grid;justify-items:center;gap:2px;box-shadow:inset 0 0 0 2px var(--line)}.bd small{color:var(--mut);font-size:13px}.bd.off{opacity:.6}
.cert svg{display:block;width:100%;height:auto;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.sel{font:inherit;font-size:16px;padding:10px;border-radius:10px;border:2px solid #c9b27a;background:#fffaf0;color:var(--pink);width:100%}
input[type=password]{font:inherit;font-size:22px;letter-spacing:8px;padding:12px;border-radius:10px;border:2px solid #c9b27a;background:#fffaf0;color:#2a1a10;caret-color:#2a1a10;width:100%}
input[type=text],input[type=date],.sel{caret-color:#2a1a10}
.reward{background:#fff3d1;border-radius:12px;padding:12px 14px;margin:10px 0;box-shadow:inset 0 0 0 2px var(--gold)}
/* NIGHT SHIFT theme */
.nsky{display:none}body.night .wsky{display:none}body.night .nsky{display:block}
body.night{--bg:#0e0d12;--bg2:#1b1a22;--line:#34323f;--gold:#ffb627;--mut:#a9a6b6;background:radial-gradient(900px 500px at 50% -10%,#2a1218,transparent 70%),var(--bg)}
body.night h1,body.night h2,body.night .year{font-family:Cinzel,Georgia,serif}
.nightcard{background:#e9e3d6}.nightcard .note{font-family:Georgia,serif;font-style:italic;background:#fffdf4;padding:12px 14px;border-radius:6px;box-shadow:inset 0 0 0 1px #d8cfb8;transform:rotate(-.6deg)}
.nightbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:900}.clock{font-family:VT323,monospace;font-size:34px;line-height:1;color:#b5303a}
.pw.low{color:#b5303a}.pbar{height:8px;border-radius:9px;background:#d8cfb8;overflow:hidden;margin:4px 0 8px}.pbar i{display:block;height:100%;background:#3c9a5a;transition:width .9s linear}
.office{display:block;width:100%;height:auto;border-radius:10px}.office.flick{animation:flick 1.6s infinite}@keyframes flick{0%,100%{opacity:1}47%{opacity:1}50%{opacity:.55}53%{opacity:1}}
.cams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.cam{position:relative;background:#14141a repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 4px);color:#cfd3d8;border-radius:8px;padding:18px 4px 4px;text-align:center;min-height:96px;display:grid;justify-items:center;align-content:end;box-shadow:inset 0 0 0 2px #2c2b36}
.cam .lbl{position:absolute;top:3px;left:5px;right:5px;font:13px/1.1 VT323,monospace;text-align:left;color:#8fe39f}.cam small{font-size:12px}
.cam.warn{box-shadow:inset 0 0 0 2px #ffb627}.cam.red{box-shadow:inset 0 0 0 3px #ff4757}.cam.red .lbl{color:#ff8a94}
.alarm{background:#2a0d12;color:#ffd9dd;border-radius:10px;padding:10px 12px;margin-top:10px;box-shadow:inset 0 0 0 2px #ff4757}.alarm .candle{background:#5a1f2a}
.six{font:clamp(64px,18vw,110px)/1 VT323,monospace;text-align:center;color:#b5303a}
#scare{position:fixed;inset:0;z-index:20;display:none;place-items:center;pointer-events:none}
#scare.on{display:grid}#scare.lvl1{background:rgba(0,0,0,.55)}#scare.lvl1 .sc-in{animation:pin .45s ease-out both}
#scare.lvl2{background:#000;animation:redf .2s 3}#scare.lvl2 .sc-in{animation:lunge .25s ease-in both,shk .08s .25s 10}
#scare svg{width:min(80vw,420px);height:auto}#scare.lvl2 svg{width:min(120vw,700px)}
@keyframes pin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}@keyframes lunge{from{transform:scale(.15)}to{transform:scale(1.15)}}
@keyframes shk{50%{transform:scale(1.15) translate(6px,-4px)}}@keyframes redf{50%{background:#3a0008}}
.seg{display:inline-flex;border-radius:12px;box-shadow:inset 0 0 0 2px var(--line);padding:3px;gap:3px;margin:0 0 10px}.seg button{min-height:40px;padding:6px 14px;box-shadow:none;background:transparent;color:var(--ink)}.seg button.on{background:var(--gold);color:#2a1a10}
.pop{animation:pop .45s ease}@keyframes pop{0%{transform:scale(.8);opacity:.3}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.frt{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:18px}.frt td{padding:6px 8px;border-bottom:1px solid #e0cfa3}.frt td:last-child{font-size:14px;color:#7a6440}.frt em{font-style:normal;color:#b5303a;font-weight:900}
.frq{font:900 clamp(24px,6.5vw,36px)/1.3 Nunito,sans-serif;text-align:center;margin:10px 0 4px}.frh{text-align:center;color:#7a6440;font-weight:700;margin:0 0 12px}
.frin{font-size:26px!important;text-align:center;max-width:340px;display:block;margin:0 auto 12px}.opts4.fr button{font-size:20px}
@media(prefers-reduced-motion:reduce){#scare .sc-in,#scare.lvl2,.office.flick{animation:none!important}.rider,#toast{transition:none}.pop,.burst g,.cf,.hit,.hop{animation:none}.burst{display:none}.bar i{transition:none}}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.houses{grid-template-columns:minmax(0,1fr)}.arena{grid-template-columns:64px minmax(0,1fr) 80px}.arena>svg:last-child{width:80px;height:80px}.build{grid-template-columns:minmax(0,1fr)}.player{grid-template-columns:72px minmax(0,1fr)}}
</style>
</head>

 for(const f of Object.values(p.facts||{}))if(!('d' in f))f.d=f.b>=2?(f.t||Date.now())+INT[f.b]*DAY:0;norm2(p);return p}

function award(p,id){norm2(p);if(p.badges.includes(id))return;p.badges.push(id);p.gems+=5;const b=BADGES.find(x=>x[0]===id);sfx('card');toast(`${badgeSvg(b,1,44)}<div><b>Badge: ${esc(b[1])}</b><br><span>${esc(b[2])}. +5 gems</span></div>`);

function tableStrong(p,t){for(let n=1;n<=12;n++)if((p.facts[fk(t,n)]||{b:0}).b<4)return false;return true}
function knownCount(p){let m=0;for(let a=1;a<=12;a++)for(let b=a;b<=12;b++)if((p.facts[fk(a,b)]||{b:0}).b>=2)m++;return m}

// ---------- parent rewards ----------
const msLabel=ms=>ms==='all78'?'Know all 78 facts':ms.startsWith('ch:')?'Finish '+CH[+ms.slice(3)].title:ms;
function rewardCheck(p,ms){norm2(p);let got=[];p.rewards.forEach(r=>{if(r.ms===ms&&!r.earned){r.earned=Date.now();got.push(r.text)}});return got}

// ---------- question types ----------
function makeQ(p,c,k){let[a,b]=k.split('x').map(Number);
 if(c.t&&b===c.t&&Math.random()<.7)[a,b]=[b,a];else if(Math.random()<.5)[a,b]=[b,a];
 const f=p.facts[k]||{b:0},r=Math.random();let type='std';
 if(!c.boss&&!c.race&&!c.duel)type=f.b>=1?(r<.5?'std':r<.72?'miss':r<.87?'mc':'tf'):(r<.75?'std':'mc');
 const q={a,b,k,type,ans:a*b};
 if(type==='miss'){q.hide=Math.random()<.5?'a':'b';q.ans=q.hide==='a'?a:b}
 if(type==='mc'){const s=new Set([a*b]);shuffle([a*(b+1),a*(b-1),(a+1)*b,(a-1)*b,a*b+10,a*b-10,a*b+2,a*b-1]).forEach(x=>{if(x>0&&s.size<4)s.add(x)});q.opts=shuffle([...s])}
 if(type==='tf'){const t=Math.random()<.5;const w=shuffle([a*(b+1),(a+1)*b,a*b+1,a*b-1,a*b+10].filter(x=>x>0&&x!==a*b))[0];q.shown=t?a*b:w;q.ans=t?'T':'F'}
 return q}
const qText=q=>q.type==='miss'?(q.hide==='a'?`? × ${q.b} = ${q.a*q.b}`:`${q.a} × ? = ${q.a*q.b}`):q.type==='tf'?`${q.a} × ${q.b} = ${q.shown}`:`${q.a} × ${q.b}`;
const QTAG={miss:'Missing ingredient: find the hidden number',tf:'True or false?',mc:'Pick the right potion'};

// ---------- core loop ----------
function nextQ(){const p=pp(),c=play.c;play.retry.forEach(x=>x.in--);const k=pickKey(p,c);
 play.q=makeQ(p,c,k);play.last=k;play.n=(play.n||0)+1;play.input='';play.fb=null;play.start=Date.now();play.petMsg=null;
 clearInterval(play.tick);
 if(c.night){if(!play.ntick)play.ntick=setInterval(nightTick,1000);const at=play.ns.anim.find(a=>a.pos>=4);if(at)armDoor(at,true)}
 if(c.boss||c.duel){play.tmax=c.duel?(p.adult?6:12):15;play.time=play.tmax;play.tick=setInterval(()=>{play.time-=.25;const el=$('.candle i');if(el)el.style.width=Math.max(0,play.time/play.tmax*100)+'%';if(play.time<=0){clearInterval(play.tick);answer(true)}},250)}
 if(c.race&&!play.rtick)play.rtick=setInterval(updRace,100);
 draw()}
function answer(timeout){const p=pp(),q=play.q,c=play.c;if(play.fb)return;if(!timeout&&play.input==='')return;clearInterval(play.tick);norm2(p);
 const ms=Date.now()-play.start,ok=!timeout&&String(play.input)===String(q.ans),f=F(p,q.k),b0=f.b,now=Date.now();f.t=now;play.card=null;let rw=[];
 if(ok){const easy=q.type==='mc'||q.type==='tf';f.c++;f.b=ms<=8000&&(!easy||f.b<2)?Math.min(5,f.b+1):Math.max(f.b,1);f.d=f.b>=2?now+INT[f.b]*DAY:0;
  p.points+=ms<=5000?15:10;p.gems+=ms<=5000?2:1;play.streak++;play.fb={ok:1,msg:c.race?'Zoom!':pickPraise(ms)};
  if(c.boss)play.hp--;if(c.duel)play.duel.score[play.duel.turn]++;if(c.race)play.race.n++;
  if(c.night){const ns=play.ns;ns.done++;if(q.door){ns.anim.find(a=>a.id===q.door).pos=0;ns.power-=4;play.fb.msg='SLAM! Door shut.';sfx('slam')}else{const far=ns.anim.slice().sort((x,y)=>y.pos-x.pos)[0];if(far.pos>0)far.pos--;sfx('ok')}}else sfx(c.boss?'hit':'ok');
  if(!c.boss&&!c.race&&!c.duel&&!c.night&&Math.random()<.07){const id=drawCard(p,0);if(id!=null){play.card=id;setTimeout(()=>sfx('card'),350)}}
  const pet=p.eq.pet;if(pet){const s0=stageOf(p.petxp[pet]||0);p.petxp[pet]=(p.petxp[pet]||0)+1;const s1=stageOf(p.petxp[pet]);if(s1>s0){play.petMsg=`Your ${item(pet).n.toLowerCase()} grew!`;if(s1===2)award(p,'grown')}}
  award(p,'first');if(play.streak>=10)award(p,'streak10');if(play.streak>=25)award(p,'streak25');if(ms<2000&&(q.type==='std'||q.type==='miss'))award(p,'fast');
  if(f.b>=4&&b0<4){if(tableStrong(p,q.a)||tableStrong(p,q.b))award(p,'master');if((q.a===7||q.b===7)&&tableStrong(p,7))award(p,'seven')}
  if(f.b>=2&&b0<2&&knownCount(p)===78)award(p,'all78')}
 else{f.w++;f.b=Math.max(0,f.b-2);f.d=f.c>0?now:0;play.retry.push({k:q.k,in:2});play.streak=0;
  play.fb={ok:0,msg:timeout?'The candle burned out!':c.race?'Oops! +3 seconds':'Not quite.'};if(c.boss)play.hearts--;if(c.race)play.race.pen+=3000;if(c.night){play.ns.power-=6;if(q.door){logAns(p,q.k,false,ms,b0,f.b);save();return nightLose(q.door)}}sfx('bad')}
 logAns(p,q.k,ok,ms,b0,f.b);save();draw();
 if(c.race)setTimeout(()=>{if(play&&play.fb)after()},ok?300:1500);
 else if(ok&&play.card==null)setTimeout(()=>{if(play&&play.fb&&play.fb.ok&&play.card==null)after()},750)}
function after(){const p=pp(),c=play.c,i=CH.indexOf(c);play.card=null;
 if(c.refresh&&!c.free.some(k=>isDue(p.facts[k]))){p.gems+=10;award(p,'fresh');save();sfx('win');return go('refreshed')}
 if(c.race&&play.race.n>=20)return raceEnd();
 if(c.night){if(play.ns.over)return;if(play.ns.power<=0)return nightLose(null);if(play.ns.done>=play.ns.need)return nightWin()}
 if(c.duel){const d=play.duel;d.round++;if(d.round>=d.rounds)return duelEnd();d.turn=1-d.turn;return go('pass')}
 if(c.boss){if(play.hp<=0)return finish(i,true);if(play.hearts<=0)return go('lost')}
 else if(!c.free&&chProg(p,c)>=1)return finish(i,false);
 nextQ()}
function finish(i,isBoss){const p=P();norm2(p);play.wonCard=null;play.rewards=[];
 if(!p.done.includes(i)){p.done.push(i);p.points+=isBoss?100:50;p.gems+=isBoss?30:15;play.wonCard=drawCard(p,isBoss?1:0)}
 p.chapter=Math.max(p.chapter,i+1);play.rewards=rewardCheck(p,'ch:'+i);
 if(isBoss){award(p,'year'+CH[i].y);if(play.hearts===3)award(p,'perfect')}
 if(p.cards.length>=10)award(p,'cards10');if(p.cards.length>=CARDS.length)award(p,'cardsall');
 save();sfx('win');play.won=i;go('won')}

// ---------- broom race ----------
const fmt=ms=>(ms/1000).toFixed(1)+'s';
function startRace(p){const ts=tablesUpTo(Math.max(2,Math.min(p.chapter,CH.length-1))),o=new Set();ts.forEach(x=>{for(let n=1;n<=12;n++)o.add(fk(x,n))});
 play={c:{title:'Broom race',free:[...o],race:1,y:1},retry:[],last:null,streak:0,hearts:3,race:{n:0,start:Date.now(),pen:0}};nextQ()}
function updRace(){if(!play||!play.race||view!=='play'){return}const p=P(),t=Date.now()-play.race.start+play.race.pen,best=norm2(p).best.race;
 const tm=$('#rtime');if(tm)tm.textContent=fmt(t);const g=$('#ghost');if(g&&best)g.style.left=`calc(${Math.min(100,t/best*100)}% - 18px)`}
function raceEnd(){clearInterval(play.rtick);play.rtick=null;const p=P();norm2(p);const t=Date.now()-play.race.start+play.race.pen,best=p.best.race,rec=!best||t<best;
 if(rec)p.best.race=t;p.gems+=rec?10:5;play.result={t,best,rec};award(p,'racer');if(rec&&best)award(p,'record');save();sfx('win');go('raced')}
function vRaced(){const p=P(),r=play.result;return header(p)+`<div class="card pop">${r.rec?burst(sparkCols(p)):''}<h2>${r.rec?(r.best?'New record!':'First record set!'):'Race finished!'}</h2>
 <div class="player">${wiz(p,r.rec?'happy':'idle',90,r.rec?'hop':'')}<div class="bubble ${r.rec?'good':''}">${fmt(r.t)}${r.best?` (best was ${fmt(r.best)})`:''}</div></div>
 <p style="margin-top:12px">${r.rec?'+10 gems. Your ghost will race at this speed next time.':'+5 gems. Your ghost was faster this time. Try again!'}</p>

  rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];emit(r.isFinal?fi:pa,{text:r[0].transcript})}};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){on=false;emit(st,{state:'idle',reason:'not_granted'})}};

  on=true;try{rec.start()}catch(x){on=false;return Promise.reject({code:'unavailable'})}emit(st,{state:'listening'});return Promise.resolve()},
  stop(){on=false;try{rec&&rec.stop()}catch(x){}return Promise.resolve()},onState(f){st.push(f)},onPartial(f){pa.push(f)},onFinal(f){fi.push(f)}}}

 else if(a==='rdel'){p.rewards.splice(+t.dataset.i,1);save();go('report')}
 else if(a==='rseen'){p.rewards.forEach(r=>{if(r.earned)r.seen=1});save();go('map')}
 else if(a==='badges')go('badges');
 else if(a==='workshop'){wdraft=null;go('workshop')}
 else if(a==='wnew'){wdraft=newCustom();go('workshop')}
 else if(a==='wedit'){wdraft=Object.assign({},(p.customs||[]).find(c=>c.id===t.dataset.id));go('workshop')}
 else if(a==='wk'){const n=$('#wname');if(n)wdraft.name=n.value;wdraft[t.dataset.k]=t.dataset.v;go('workshop')}
 else if(a==='wcancel'){wdraft=null;go('workshop')}
 else if(a==='wsave'){const n=$('#wname').value.trim();if(!n){$('#wmsg').textContent='Give it a name first!';$('#wname').focus();return}wdraft.name=n.slice(0,14);p.customs=p.customs||[];
  const i=p.customs.findIndex(c=>c.id===wdraft.id);if(i>=0)p.customs[i]=wdraft;else if(p.customs.length<3)p.customs.push(wdraft);wdraft=null;sfx('buy');save();go('workshop')}
 else if(a==='wdel'){p.customs=(p.customs||[]).filter(c=>c.id!==t.dataset.id);save();go('workshop')}
 else if(a==='theme'){p.theme=t.dataset.v;save();go('report')}
 else if(a==='night')startNight(p,+t.dataset.n);
 else if(a==='nstart')nextQ();
 else if(a==='scare'){p.scare=+t.dataset.v;save();go('report')}
 else if(a==='bkup'){DL.save({filename:'ravenmoor-backup-'+today()+'.json',data:JSON.stringify(state)}).then(()=>{manageMsg='Backup saved.';go('report')}).catch(e=>{manageMsg=e&&e.code==='declined'?'Backup not saved.':'Could not save a backup here.';go('report')})}
 else if(a==='mren'){armed='ren:'+t.dataset.id;manageMsg='';go('report');const i=$('#rnm');if(i){i.focus();i.select()}}
 else if(a==='mrensave'){const v=$('#rnm').value.trim();if(v){state.profiles[t.dataset.id].name=v.slice(0,20);save();manageMsg='Renamed.'}armed=null;go('report')}
 else if(a==='mreset'){const id=t.dataset.id;if(armed!=='reset:'+id){armed='reset:'+id;manageMsg='';return go('report')}
  const o=state.profiles[id];state.profiles[id]={name:o.name,house:o.house,av:o.av,chapter:0,done:[],facts:{},points:0,gems:0,rewards:(o.rewards||[]).map(r=>({ms:r.ms,text:r.text}))};armed=null;manageMsg=o.name+' is starting fresh.';save();go('report')}
 else if(a==='mdel'){const id=t.dataset.id;if(armed!=='del:'+id){armed='del:'+id;manageMsg='';return go('report')}
  const nm=state.profiles[id].name;delete state.profiles[id];armed=null;manageMsg=nm+' was deleted.';if(state.active===id)state.active=Object.keys(state.profiles)[0]||null;save();go(state.active?'report':'start')}
 else if(a==='cert'){play=play||{};play.certYear=+t.dataset.y;go('cert')}
 else if(a==='certsave')saveCert();
 else if(a==='race')startRace(p);
 else if(a==='duel'){duelPick=null;go('duelsetup')}
 else if(a==='dpick'){duelPick=t.dataset.id;go('duelsetup')}
 else if(a==='dstart')startDuel();
 else if(a==='dready')nextQ();
 else if(a==='opt'&&play&&!play.fb){play.input=t.dataset.v;answer(false)}
 else if(a==='mic')micClick();
 else if(a==='read'){const c=play.c;if(c.night)read(NOTES[c.night-1]);else read(c.title+'. '+c.s.replace(/\{n\}/g,p.name).replace(/\{h\}/g,house(p).name))}
 else if(a==='refresh'){const ks=dueKeys(p).sort((x,y)=>p.facts[x].b-p.facts[y].b).slice(0,15);play={c:{title:'Spell refresh',free:ks,refresh:1,y:1},retry:[],last:null,streak:0,hearts:3};nextQ()}});
document.addEventListener('keydown',e=>{if(view!=='play'||!play||!play.q)return;const ty=play.q.type;
 if(!play.fb&&ty==='tf'&&/^[tf]$/i.test(e.key)){play.input=e.key.toUpperCase();answer(false);return}
 if(!play.fb&&(ty==='mc'||ty==='tf')&&e.key!=='Enter')return;
 if(/^[0-9]$/.test(e.key)&&!play.fb&&play.input.length<3){play.input+=e.key;draw()}
 else if(e.key==='Backspace'&&!play.fb){play.input=play.input.slice(0,-1);draw()}
 else if(e.key==='Enter'){e.preventDefault();play.fb?((!play.fb.ok||play.card!=null)&&after()):answer(false)}});

load();go(state.active&&P()?'map':'start');connect();initTTS();initDict();initDL();
}
</script>
</body>
</html>
